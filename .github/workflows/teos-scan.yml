name: TEOS Sentinel Security Scan

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

env:
  TEOS_API: https://teoslinker-bot.railway.app

jobs:
  teos-scan:
    name: TEOS Code Security Gate
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install dependencies
        run: sudo apt-get install -y jq curl

      - name: Get changed files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- '*.js' '*.ts' '*.py' '*.sh' '*.mjs' '*.cjs' 2>/dev/null || echo "")
          else
            FILES=$(git diff --name-only HEAD~1 HEAD -- '*.js' '*.ts' '*.py' '*.sh' '*.mjs' '*.cjs' 2>/dev/null || echo "")
          fi
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "Found files to scan: $FILES"

      - name: Run TEOS security scan
        id: scan
        env:
          TEOS_TOKEN: ${{ secrets.TEOS_TOKEN }}
        run: |
          BLOCKED=0
          WARNED=0
          ALLOWED=0
          REPORT=""
          BLOCKED_FILES=""

          FILES="${{ steps.changed.outputs.files }}"

          if [ -z "$FILES" ]; then
            echo "No code files changed. Scan skipped."
            echo "blocked=0" >> $GITHUB_OUTPUT
            echo "report=No code files changed." >> $GITHUB_OUTPUT
            exit 0
          fi

          for file in $FILES; do
            if [ ! -f "$file" ]; then
              echo "Skipping deleted file: $file"
              continue
            fi

            echo "Scanning: $file"
            CODE=$(jq -Rs . < "$file")

            AUTH_HEADER=""
            if [ -n "$TEOS_TOKEN" ]; then
              AUTH_HEADER="-H \"X-TEOS-Token: $TEOS_TOKEN\""
            fi

            RESULT=$(curl -s --max-time 15 -X POST "$TEOS_API/api/ci/scan" \
              -H "Content-Type: application/json" \
              ${TEOS_TOKEN:+-H "X-TEOS-Token: $TEOS_TOKEN"} \
              -d "{\"code\": $CODE}" 2>/dev/null)

            if [ -z "$RESULT" ]; then
              echo "Warning: Could not reach TEOS API for $file — skipping"
              continue
            fi

            DECISION=$(echo "$RESULT" | jq -r '.decision // "ALLOW"')
            SCORE=$(echo "$RESULT" | jq -r '.score // 0')
            FINDINGS=$(echo "$RESULT" | jq -r '.findings[]?.message // empty' 2>/dev/null | head -3 | tr '\n' '; ')

            case $DECISION in
              BLOCK)
                BLOCKED=$((BLOCKED+1))
                BLOCKED_FILES="$BLOCKED_FILES $file"
                REPORT="$REPORT\n❌ **BLOCK** \`$file\` (score: $SCORE)\n   > $FINDINGS"
                echo "::error file=$file::TEOS BLOCK — Score: $SCORE — $FINDINGS"
                ;;
              WARN)
                WARNED=$((WARNED+1))
                REPORT="$REPORT\n⚠️  **WARN** \`$file\` (score: $SCORE)\n   > $FINDINGS"
                echo "::warning file=$file::TEOS WARN — Score: $SCORE — $FINDINGS"
                ;;
              *)
                ALLOWED=$((ALLOWED+1))
                REPORT="$REPORT\n✅ **ALLOW** \`$file\` (score: $SCORE)"
                echo "ALLOW: $file (score: $SCORE)"
                ;;
            esac
          done

          SUMMARY="**TEOS Sentinel Scan Results**\n\nScanned: $((BLOCKED+WARNED+ALLOWED)) files · ❌ Blocked: $BLOCKED · ⚠️ Warned: $WARNED · ✅ Allowed: $ALLOWED\n$REPORT\n\n*Powered by [TEOS Sovereign Sentinel](https://teos-sentinel-shield.vercel.app) — Elmahrosa International*"

          echo "blocked=$BLOCKED" >> $GITHUB_OUTPUT
          echo "warned=$WARNED" >> $GITHUB_OUTPUT
          echo "allowed=$ALLOWED" >> $GITHUB_OUTPUT
          {
            echo "report<<REPORT_EOF"
            echo -e "$SUMMARY"
            echo "REPORT_EOF"
          } >> $GITHUB_OUTPUT

          if [ $BLOCKED -gt 0 ]; then
            echo ""
            echo "TEOS SENTINEL: $BLOCKED file(s) BLOCKED — $BLOCKED_FILES"
            echo "Fix dangerous patterns before merging."
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const report = `${{ steps.scan.outputs.report }}`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

      - name: Fail if blocked
        if: steps.scan.outputs.blocked != '0' && steps.scan.outputs.blocked != ''
        run: |
          echo "TEOS Sentinel blocked ${{ steps.scan.outputs.blocked }} file(s)."
          echo "Review the findings above and remove dangerous patterns."
          exit 1

      - name: Pass
        if: steps.scan.outputs.blocked == '0' || steps.scan.outputs.blocked == ''
        run: echo "TEOS Sentinel — all scans passed."
